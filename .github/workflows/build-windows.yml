name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      libreoffice:
        description: "Kem LibreOffice (+~350 MB)"
        type: boolean
        default: true
      ollama:
        description: "Kem Ollama (AI dich chay tren may)"
        type: boolean
        default: true
      model:
        description: "Kem san model dich (+~3.3 GB; bo tich thi model duoc tai luc cai)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Luu tam cac file tai ve (LibreOffice...) giua cac lan build
        uses: actions/cache@v4
        with:
          path: build_win/vendor/LibreOffice.msi
          key: vendor-libreoffice-v1
      - name: Ghi so build vao app
        shell: pwsh
        run: |
          "BUILD = '${{ github.run_number }}'" | Set-Content -Encoding utf8 litepdf/_build.py
      - name: Build
        timeout-minutes: 90
        shell: pwsh
        run: |
          $a = @{}      # bang tham so (splat theo ten): mang chuoi se bi hieu la tham so vi tri
          # chay tu dong khi day ma len (push): kem LibreOffice, co muc Ollama, model tai luc cai
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            if ("${{ inputs.libreoffice }}" -ne "true") { $a.NoLibreOffice = $true }
            if ("${{ inputs.ollama }}" -ne "true") { $a.NoOllama = $true }
            if ("${{ inputs.model }}" -ne "true") { $a.NoModel = $true }
          } else { $a.NoModel = $true }
          ./packaging/windows/build_windows.ps1 @a
      - name: Luu nhat ky build vao nhanh build-logs
        if: always()
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "logs"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          foreach ($f in @("build_win/build.log", "build_win/selftest.json", "build_win/inno.log")) { if (Test-Path $f) { Copy-Item $f $d } }
          Set-Location $d
          git init -q -b build-logs
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          "run ${{ github.run_number }} - ${{ job.status }}" | Set-Content status.txt
          git add -A
          git commit -q -m "log run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs
      - name: Upload selftest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: build_win/selftest.json
          if-no-files-found: ignore
      - name: Dat ten file cai kem so build
        shell: pwsh
        run: |
          # moi ban build mot ten file rieng: tai nhieu lan khong bi lan voi file cu trong thu muc Downloads
          Get-ChildItem build_win/output/*.exe | ForEach-Object { Rename-Item $_.FullName ($_.Name -replace '-Setup\.exe$', "-build${{ github.run_number }}-Setup.exe") }
          Get-ChildItem build_win/output
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Editor-Lite-Setup
          path: build_win/output/*
          compression-level: 0
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: PDF Editor Lite 1.0.0 (build ${{ github.run_number }})
          body: |
            Bo cai Windows 64-bit, tao tu dong.
            Tai file PDF-Editor-Lite-1.0.0-build${{ github.run_number }}-Setup.exe ve va chay (dong PDF Editor Lite truoc khi cai). Khi cai co the tich chon tung thanh phan.
          files: build_win/output/*.exe
          fail_on_unmatched_files: true
